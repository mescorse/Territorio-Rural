[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recorta-mapas"
version = "0.1.0"
description = "Prepara camadas de territórios rurais para o Google My Maps a partir de dados do Censo 2022 (IBGE)."
requires-python = ">=3.11"
dependencies = [
    "shapely>=2.0",
    "lxml>=4.9",
    "pyproj>=3.5",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
recorta-mapas = "recorta_mapas.cli:main"

[tool.setuptools.packages.find]
include = ["recorta_mapas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
